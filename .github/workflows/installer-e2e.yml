name: Installer E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/installer-e2e.yml"
      - "build.zig"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "config.toml.example"
      - "deploy/**"
      - "src/**"
      - "test/installer-e2e/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/installer-e2e.yml"
      - "build.zig"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "config.toml.example"
      - "deploy/**"
      - "src/**"
      - "test/installer-e2e/**"

concurrency:
  group: installer-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proxy-image:
    name: Build current installer image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build and save the current checkout image
        env:
          CURRENT_IMAGE: mtproto-installer-e2e:${{ github.sha }}
        run: |
          docker build --build-arg ZIG_VERSION=0.17.0 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$CURRENT_IMAGE" .
          docker save -o "$RUNNER_TEMP/installer-e2e-image.tar" "$CURRENT_IMAGE"

      - name: Upload current image
        uses: actions/upload-artifact@v7
        with:
          name: installer-e2e-image-${{ github.sha }}
          path: ${{ runner.temp }}/installer-e2e-image.tar
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  docker-compose-installer:
    name: ${{ matrix.name }}
    needs: proxy-image
    # A producer failure must fail the existing matrix checks, not skip them.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            name: Debian 12
            artifact: debian-12
          - image: debian:13
            name: Debian 13
            artifact: debian-13
          - image: ubuntu:24.04
            name: Ubuntu 24.04
            artifact: ubuntu-24-04
          - image: ubuntu:26.04
            name: Ubuntu 26.04
            artifact: ubuntu-26-04

    steps:
      - name: Require a successful current image build
        env:
          IMAGE_BUILD_RESULT: ${{ needs.proxy-image.result }}
        run: test "$IMAGE_BUILD_RESULT" = success

      - uses: actions/checkout@v7

      - name: Download current image
        uses: actions/download-artifact@v8
        with:
          name: installer-e2e-image-${{ github.sha }}
          path: ${{ runner.temp }}/installer-e2e-image

      - name: Load current image
        run: docker load -i "$RUNNER_TEMP/installer-e2e-image/installer-e2e-image.tar"

      - name: Run isolated installer E2E
        env:
          MTPROTO_INSTALLER_E2E_IMAGE: ${{ matrix.image }}
          MTPROTO_INSTALLER_E2E_PREBUILT_IMAGE: mtproto-installer-e2e:${{ github.sha }}
        run: test/installer-e2e/run.sh

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-e2e-${{ matrix.artifact }}
          path: test/installer-e2e/logs/
          if-no-files-found: ignore
          retention-days: 14
