name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check Zig formatting
        run: zig fmt --check build.zig src

      - name: Check Python harness syntax
        run: python3 -m py_compile test/*.py test/web-bridge/*.py

      - name: ShellCheck deploy scripts
        run: shellcheck --severity=error docker-entrypoint.sh deploy/*.sh deploy/monitor/*.sh

      - name: Run tests
        run: zig build test

      - name: Run WEB proxy bridge-page contract tests
        run: zig build web-bridge

      - name: Run ReleaseSafe tests
        run: zig build -Doptimize=ReleaseSafe test

      - name: Debug build
        run: zig build

      - name: Real daemon smoke test
        run: python3 test/daemon_smoke.py --binary zig-out/bin/mtproto-proxy

      - name: Release build (native)
        run: zig build -Doptimize=ReleaseFast

      - name: Cross-compile for Linux x86_64
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux

      - name: Cross-compile deploy target
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux -Dcpu=x86_64_v3+aes

      - name: Cross-compile for Linux aarch64
        run: zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux

      - name: Verify binary exists
        run: |
          ls -lh zig-out/bin/mtproto-proxy
          file zig-out/bin/mtproto-proxy
          readelf -h zig-out/bin/mtproto-proxy | grep -Eq 'Type:[[:space:]]+DYN'

      - name: Docker build smoke
        run: docker build --build-arg ZIG_VERSION=0.16.0 -t mtproto-zig-smoke .

      - name: Docker safe-default smoke
        shell: bash
        run: |
          set -euo pipefail
          container=mtproto-zig-safe-default-smoke
          output_dir="$(mktemp -d)"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$output_dir"
          }
          trap cleanup EXIT

          docker run -d --name "$container" mtproto-zig-smoke >/dev/null
          for _ in $(seq 1 20); do
            if docker cp "$container:/etc/mtproto-proxy/config.toml" "$output_dir/config.toml" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done

          test -f "$output_dir/config.toml"
          test "$(stat -c '%a' "$output_dir/config.toml")" = 600
          secret="$(awk -F '"' '/^[[:space:]]*user1[[:space:]]*=/{print $2; exit}' "$output_dir/config.toml")"
          [[ "$secret" =~ ^[0-9a-f]{32}$ ]]
          if docker logs "$container" 2>&1 | grep -Fq -- "$secret"; then
            echo "generated access secret leaked into container logs" >&2
            exit 1
          fi

  fuzz:
    name: Security Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run bounded coverage-guided fuzzing
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            fuzz_iterations=25K
          else
            fuzz_iterations=100K
          fi
          echo "Running ${fuzz_iterations} iterations per fuzz target"
          zig build -Doptimize=ReleaseSafe fuzz --fuzz="$fuzz_iterations"

  bench:
    name: Bench & Soak
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run microbenchmark
        run: zig build -Doptimize=ReleaseFast bench 2>&1 | tee bench-output.txt

      - name: Run soak test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SOAK_SECONDS=10
          else
            SOAK_SECONDS=60
          fi
          echo "Running soak for ${SOAK_SECONDS}s"
          zig build -Doptimize=ReleaseFast soak -- --seconds=${SOAK_SECONDS} 2>&1 | tee soak-output.txt

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-soak-results
          path: |
            bench-output.txt
            soak-output.txt
          retention-days: 90
