name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-26.04
    outputs:
      run_ci: ${{ steps.classify.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v7

      - name: Keep full CI unless every changed path is documentation
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          documentation = {
              b"README.md", b"test/README.md", b"LICENSE",
              b".agent/skills/architecture/SKILL.md",
              b".agent/skills/client-behavior/SKILL.md",
              b".agent/skills/zig-gotchas/SKILL.md",
              b".agent/workflows/deployment.md",
              b".agent/workflows/diagnostics.md",
              b".agent/workflows/migration.md",
          }
          run_ci = True
          base = os.environ.get("BASE_SHA", "")
          if (os.environ["GITHUB_EVENT_NAME"] in {"push", "pull_request"}
                  and re.fullmatch(r"[0-9a-fA-F]{40}", base) and int(base, 16)):
              try:
                  subprocess.run(
                      ["git", "fetch", "--no-tags", "--depth=1", "origin", base],
                      check=True,
                  )
                  paths = subprocess.check_output([
                      "git", "diff", "--name-only", "--no-renames", "-z",
                      base, os.environ["GITHUB_SHA"], "--",
                  ]).split(b"\0")
                  paths = [path for path in paths if path]
                  run_ci = not paths or any(path not in documentation for path in paths)
              except (OSError, subprocess.CalledProcessError):
                  print("Change comparison unavailable; running full CI")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_ci={str(run_ci).lower()}\n")
          PY

  test:
    name: Test & Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_ci != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check Zig formatting
        run: zig fmt --check build.zig src test/hardware_aes_probe.zig

      - name: Check Python harness syntax
        run: python3 -m py_compile deploy/web_probe.py test/*.py test/web-bridge/*.py

      - name: Test benchmark and probe helpers
        run: python3 -m unittest discover -s test -p 'test_probe_helpers.py'

      - name: Test offline stress harness helpers
        run: python3 -m unittest discover -s test -p 'test_stress_helpers.py'

      - name: Test WEB setup end-to-end probe fixtures
        run: python3 -m unittest discover -s test -p 'test_web_setup_probe.py'

      - name: ShellCheck scripts
        run: shellcheck --severity=error docker-entrypoint.sh deploy/*.sh deploy/monitor/*.sh test/check_hardware_aes.sh test/run_fuzz.sh test/installer-e2e/run.sh test/installer-e2e/fake-*

      - name: Run tests
        run: zig build test

      - name: Run WEB proxy bridge-page contract tests
        run: zig build web-bridge

      - name: Run safe tests
        run: zig build -Doptimize=safe test

      - name: Run baseline safe tests
        run: zig build -Doptimize=safe -Dcpu=baseline test

      - name: Run fast tests
        run: zig build -Doptimize=fast test

      - name: Debug build
        run: zig build

      - name: Real daemon smoke test
        run: python3 test/daemon_smoke.py --binary zig-out/bin/mtproto-proxy

      - name: Real-process relay E2E
        run: zig build e2e

      - name: Multi-worker reuseport and relay E2E
        run: zig build e2e -- --workers=2

      - name: Shipping-build real-process relay E2E
        run: zig build -Doptimize=fast e2e

      - name: Hardened-build real-process relay E2E
        run: zig build -Doptimize=fast -Ddataplane_safety=true e2e

      - name: Hardened release build (native)
        run: |
          zig build -Doptimize=fast -Ddataplane_safety=true
          readelf -h zig-out/bin/mtproto-proxy | grep -Eq 'Type:[[:space:]]+DYN'

      - name: Release build (native)
        run: zig build -Doptimize=fast

      - name: Cross-compile for Linux x86_64
        run: zig build -Doptimize=fast -Dtarget=x86_64-linux

      - name: Cross-compile deploy target
        run: zig build -Doptimize=fast -Dtarget=x86_64-linux -Dcpu=x86_64_v3+aes

      - name: Verify optimized Docker target enables hardware AES
        run: bash test/check_hardware_aes.sh

      - name: Cross-compile for Linux aarch64
        run: zig build -Doptimize=fast -Dtarget=aarch64-linux

      - name: Verify binary exists
        run: |
          ls -lh zig-out/bin/mtproto-proxy
          file zig-out/bin/mtproto-proxy
          readelf -h zig-out/bin/mtproto-proxy | grep -Eq 'Type:[[:space:]]+DYN'

      - name: Docker build smoke
        run: docker build --build-arg ZIG_VERSION=0.17.0 -t mtproto-zig-smoke .

      - name: Docker safe-default smoke
        shell: bash
        run: |
          set -euo pipefail
          container=mtproto-zig-safe-default-smoke
          output_dir="$(mktemp -d)"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$output_dir"
          }
          trap cleanup EXIT

          docker run -d --name "$container" mtproto-zig-smoke >/dev/null
          for _ in $(seq 1 20); do
            if docker cp "$container:/etc/mtproto-proxy/config.toml" "$output_dir/config.toml" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done

          test -f "$output_dir/config.toml"
          test "$(stat -c '%a' "$output_dir/config.toml")" = 600
          secret="$(awk -F '"' '/^[[:space:]]*user1[[:space:]]*=/{print $2; exit}' "$output_dir/config.toml")"
          [[ "$secret" =~ ^[0-9a-f]{32}$ ]]
          if docker logs "$container" 2>&1 | grep -Fq -- "$secret"; then
            echo "generated access secret leaked into container logs" >&2
            exit 1
          fi

  fuzz:
    name: Security Fuzz
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_ci != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run bounded coverage-guided fuzzing
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            fuzz_iterations=25K
          else
            fuzz_iterations=100K
          fi
          echo "Running ${fuzz_iterations} iterations per fuzz target"
          bash test/run_fuzz.sh "$fuzz_iterations" fuzz-artifacts 12m

      - name: Upload fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: security-fuzz-failure
          path: fuzz-artifacts/
          if-no-files-found: warn
          retention-days: 90

  bench:
    name: Bench & Soak
    runs-on: ubuntu-26.04
    needs: [changes, test]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.outputs.run_ci != 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run microbenchmark
        run: zig build -Doptimize=fast bench 2>&1 | tee bench-output.txt

      - name: Run FakeTLS handshake benchmark
        run: zig build -Doptimize=fast bench -- handshake --iterations=500000 2>&1 | tee handshake-output.txt

      - name: Run single-candidate handshake-path benchmark
        run: zig build -Doptimize=fast bench -- handshake-path --iterations=500000 --candidate-count=1 2>&1 | tee handshake-path-single-output.txt

      - name: Run inline-candidate handshake-path benchmark
        run: zig build -Doptimize=fast bench -- handshake-path --iterations=500000 --candidate-count=4 2>&1 | tee handshake-path-inline-output.txt

      - name: Run heap-fallback handshake-path benchmark
        run: zig build -Doptimize=fast bench -- handshake-path --iterations=200000 --candidate-count=8 2>&1 | tee handshake-path-heap-output.txt

      - name: Run soak test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SOAK_SECONDS=10
          else
            SOAK_SECONDS=60
          fi
          echo "Running soak for ${SOAK_SECONDS}s"
          zig build -Doptimize=fast soak -- --seconds=${SOAK_SECONDS} 2>&1 | tee soak-output.txt

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-soak-results
          path: |
            bench-output.txt
            handshake-output.txt
            handshake-path-single-output.txt
            handshake-path-inline-output.txt
            handshake-path-heap-output.txt
            soak-output.txt
          retention-days: 90

  arm64:
    name: Native ARM64 Runtime
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_ci != 'false' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run native ARM64 tests
        run: zig build test

      - name: Build native ARM64 daemon
        run: zig build

      - name: Run native ARM64 daemon smoke
        run: python3 test/daemon_smoke.py --binary zig-out/bin/mtproto-proxy

      - name: Run native ARM64 soak
        run: zig build -Doptimize=fast soak -- --seconds=10 --threads=4
