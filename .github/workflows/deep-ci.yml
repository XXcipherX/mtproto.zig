name: Deep CI

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 0"

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run unit tests under ThreadSanitizer
        run: zig build -Doptimize=ReleaseSafe -Dtsan=true test

      - name: Run multithreaded soak under ThreadSanitizer
        run: zig build -Doptimize=ReleaseSafe -Dtsan=true soak -- --seconds=30 --threads=4
