name: Deep CI

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 0"

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run unit tests under ThreadSanitizer
        run: zig build -Doptimize=ReleaseSafe -Dtsan=true test

      - name: Run multithreaded soak under ThreadSanitizer
        run: zig build -Doptimize=ReleaseSafe -Dtsan=true soak -- --seconds=30 --threads=4

  valgrind:
    name: Valgrind Memcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes valgrind

      - name: Build baseline ReleaseSafe daemon
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Run real daemon smoke under Memcheck
        run: |
          python3 test/daemon_smoke.py \
            --binary zig-out/bin/mtproto-proxy \
            --startup-timeout-sec 20 \
            --shutdown-timeout-sec 20 \
            --launcher \
            valgrind \
            --tool=memcheck \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect \
            --track-origins=yes \
            --num-callers=40 \
            --max-stackframe=8388608 \
            --error-exitcode=97 \
            --log-file=valgrind.log

      - name: Upload Memcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-memcheck-report
          path: valgrind.log
          if-no-files-found: warn
          retention-days: 30

  fuzz:
    name: Extended Security Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run extended bounded fuzz campaign
        shell: bash
        run: bash test/run_fuzz.sh 1M deep-fuzz-artifacts 40m

      - name: Upload extended fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extended-security-fuzz-failure
          path: deep-fuzz-artifacts/
          if-no-files-found: warn
          retention-days: 90
