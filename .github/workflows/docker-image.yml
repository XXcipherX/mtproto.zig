name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        default: latest
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64,linux/arm64
      zig_version:
        description: Zig version used by the Docker build
        required: true
        default: 0.16.0
      push_latest:
        description: Also publish the latest tag
        required: true
        type: boolean
        default: true
      publish_amd64_v3:
        description: Also publish linux/amd64 image built with -Dcpu=x86_64_v3+aes
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,prefix=sha-

      - name: Docker metadata (amd64-v3)
        id: meta_amd64_v3
        if: ${{ inputs.publish_amd64_v3 }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}-amd64-v3
            type=raw,value=latest-amd64-v3,enable=${{ inputs.push_latest }}
            type=sha,prefix=sha-,suffix=-amd64-v3

      - name: Build and push generic image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            ZIG_VERSION=${{ inputs.zig_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-generic
          cache-to: type=gha,scope=docker-generic,mode=max

      - name: Build and push amd64-v3 image
        if: ${{ inputs.publish_amd64_v3 }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            ZIG_VERSION=${{ inputs.zig_version }}
            MTPROTO_CPU=x86_64_v3+aes
          tags: ${{ steps.meta_amd64_v3.outputs.tags }}
          labels: ${{ steps.meta_amd64_v3.outputs.labels }}
          cache-from: type=gha,scope=docker-amd64-v3
          cache-to: type=gha,scope=docker-amd64-v3,mode=max

      - name: Summary
        run: |
          {
            echo "### Published generic image"
            echo ""
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/'
            if [ "${{ inputs.publish_amd64_v3 }}" = "true" ]; then
              echo ""
              echo "### Published amd64-v3 image"
              echo ""
              echo '${{ steps.meta_amd64_v3.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
