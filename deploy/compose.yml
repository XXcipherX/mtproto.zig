services:
  mtproto-proxy:
    image: ${MTPROTO_IMAGE:-ghcr.io/xxcipherx/mtproto.zig:latest}
    container_name: mtproto-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.toml:/etc/mtproto-proxy/config.toml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
